# By default, Spring Boot configures the application to connect to an in-memory store with the
# username sa and an empty password.
# Testcontainers starts a throwaway Postgres in Docker (image version matches the dev server, see flyway comment in pom.xml).
# TC_DAEMON keeps the container running until the JVM ends, so all cached application contexts share it.
# The container credentials are used, so no username/password needed.
# For inspecting test data afterwards, the old dev DB can still be used by overriding on the command line:
#   mvn -pl services test -Dspring.datasource.url="jdbc:postgresql://192.168.98.151:5432/worldmesh?currentSchema=worldmesh_test" -Dspring.datasource.username=worldmesh -Dspring.datasource.password=worldmesh -Dspring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:tc:postgresql:14:///worldmesh?currentSchema=worldmesh_test&TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

#traditional test setup with out-of-docker DB
#spring.datasource.url=jdbc:postgresql://192.168.98.151:5432/worldmesh?currentSchema=worldmesh_test;
#spring.datasource.username=worldmesh
#spring.datasource.password=worldmesh

#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.database-platform=org.hibernate.dialect.H2
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.schemas=worldmesh_test
spring.flyway.clean-disabled=false

spring.jpa.properties.hibernate.default_schema=worldmesh_test
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true

